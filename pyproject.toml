[project]
name = "hermes-control"
version = "1.7.0"
description = "A desktop control panel for Nous Research's Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "at0m-b0mb" }]
dependencies = ["PySide6>=6.7", "PyYAML>=6.0", "httpx>=0.27"]

[project.scripts]
hermes-control = "hermes_control.__main__:main"

[project.urls]
Homepage = "https://github.com/at0m-b0mb/HermesControl"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hermes_control*"]
